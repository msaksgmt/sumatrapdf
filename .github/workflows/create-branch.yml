name: Create 3.6.1 branch

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  create-branch:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create branch from 3.6.1 tag
        run: |
          git fetch origin tag 3.6.1rel
          git checkout -b 3.6.1-no-logo 3.6.1rel
          git push origin 3.6.1-no-logo
